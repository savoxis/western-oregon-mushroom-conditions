# shrooms.strong.beer fallback copy (served only while DNS points at home). Mirrors the VPS Caddy block: same headers and cache rules.
server {
    listen 80 default_server;
    server_name _;
    root /config/www;
    index index.html;
    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 512;
    gzip_vary on;

    location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok\n"; }

    location /data/ {
        include /config/nginx/sec-headers.conf;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        try_files $uri =404;
    }
    location ~ ^/(vendor/|favicon\.svg$) {
        include /config/nginx/sec-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }
    location / {
        include /config/nginx/sec-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
